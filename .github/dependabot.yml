version: 2

updates:
  # pnpm workspace — Dependabot detects pnpm-lock.yaml at the repo root and
  # updates dependencies across every apps/*/packages/* workspace package
  # from this one entry; it does not need one entry per workspace package.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Security patches land immediately as individual PRs (not grouped,
      # so they're never held up waiting for the weekly batch); everything
      # else groups by risk so CI runs once per batch instead of once per
      # package bump.
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Majors that rewrite the API we use: otplib 13 (the TOTP code in the
    # auth path) and @tanstack/react-table 9 (packages/ui's DataTable and
    # its column types). Taken on purpose as a migration, not a bump.
    ignore:
      - dependency-name: 'otplib'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  # Dockerfiles under infra/docker/ (FROM base image versions).
  - package-ecosystem: 'docker'
    directory: '/infra/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore(docker)'

  # GitHub Actions used by .github/workflows/*.yml.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      # CodeQL's init and analyze steps must run the same version (the
      # analyze step refuses a config written by another), so they move
      # together in one PR.
      codeql-action:
        patterns: ['github/codeql-action*']
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
