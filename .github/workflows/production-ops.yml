name: Production ops

# Manual-only maintenance on the production server, over the same SSH
# secrets publish-userscript.yml uses (PRODUCTION_SSH_HOST / _USER /
# _PRIVATE_KEY, optional _KNOWN_HOSTS). The work itself is
# infra/scripts/production-ops.sh, copied from this commit:
#
#   diagnose     what runs where (image tags, services, admin count); changes nothing
#   deploy       bring the server's checkout up to a commit on main and run
#                infra/scripts/vm-deploy.sh there (backup, rollback tags,
#                build, migrate, restart, health check)
#   admin-login  set the (single) admin account's password, unlock it and
#                clear its 2FA
#
# This repository and its logs are public: never pass a password here. For
# admin-login, `password_hash` takes the new password's argon2id hash, e.g.
#   node -e "require('argon2').hash(process.argv[1],{type:2}).then(console.log)" '<password>'
# run from apps/api, which is safe to show.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [diagnose, deploy, admin-login, account, session-report]
        required: true
      commit:
        description: "deploy: commit on main to deploy (empty = this run's commit)"
        required: false
        default: ''
      email_sha256:
        description: 'account: sha256 hex of the lowercased email (never the email)'
        required: false
        default: ''
      password_hash:
        description: "admin-login: the new password's argon2id hash (never the password)"
        required: false
        default: ''
      report_pubkey:
        description: 'session-report: base64 PEM public key the report is encrypted to'
        required: false
        default: ''
      player:
        description: 'session-report: player name to filter on (empty = every player)'
        required: false
        default: ''
      hours:
        description: 'session-report: how many hours back'
        required: false
        default: '36'

permissions:
  contents: read

# One at a time: two deploys must never interleave.
concurrency:
  group: production-ops
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: run on the production server
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          CADDY_CONTAINER: ${{ vars.CADDY_CONTAINER || 'sniper-ledger-prod-caddy-1' }}
          ACTION: ${{ inputs.action }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_HASH: ${{ inputs.password_hash }}
          INPUT_EMAIL_SHA: ${{ inputs.email_sha256 }}
          INPUT_PUBKEY: ${{ inputs.report_pubkey }}
          INPUT_PLAYER: ${{ inputs.player }}
          INPUT_HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::PRODUCTION_SSH_HOST / PRODUCTION_SSH_USER / PRODUCTION_SSH_PRIVATE_KEY are not all set"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30)
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            opts+=(-o StrictHostKeyChecking=yes)
          else
            opts+=(-o StrictHostKeyChecking=accept-new)
          fi

          commit="${INPUT_COMMIT:-$GITHUB_SHA}"
          [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::commit must be a commit sha"; exit 1; }
          hash_b64=""
          if [ "$ACTION" = admin-login ]; then
            [ -n "$INPUT_HASH" ] || { echo "::error::admin-login needs password_hash"; exit 1; }
          fi
          if [ -n "$INPUT_HASH" ]; then
            hash_b64="$(printf '%s' "$INPUT_HASH" | base64 -w0)"
          fi
          email_sha="$(printf '%s' "$INPUT_EMAIL_SHA" | tr -cd '0-9a-f')"
          # Quoted into the remote command below: keep each to a safe charset.
          pubkey="$(printf '%s' "$INPUT_PUBKEY" | tr -cd 'A-Za-z0-9+/=')"
          player="$(printf '%s' "$INPUT_PLAYER" | tr -cd 'A-Za-z0-9 .-')"
          hours="$(printf '%s' "${INPUT_HOURS:-36}" | tr -cd '0-9')"
          compose_sha="$(sha256sum infra/docker-compose.prod.yml | cut -d' ' -f1)"

          remote="$SSH_USER@$SSH_HOST"
          dir="/tmp/nova-ops-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2029 # $dir is meant to expand here, on the runner
          ssh "${opts[@]}" "$remote" "mkdir -p '$dir'"
          scp "${opts[@]}" infra/scripts/production-ops.sh "$remote:$dir/"
          # shellcheck disable=SC2029 # these expand on the runner, by design
          ssh "${opts[@]}" "$remote" \
            "OPS_ACTION='$ACTION' DEPLOY_SHA='$commit' HASH_B64='$hash_b64' EMAIL_SHA='$email_sha' REPORT_PUBKEY_B64='$pubkey' REPORT_PLAYER='$player' REPORT_HOURS='$hours' REPO_COMPOSE_SHA='$compose_sha' CADDY_CONTAINER='$CADDY_CONTAINER' bash '$dir/production-ops.sh'; s=\$?; rm -rf '$dir'; exit \$s" \
            | tee ops.log
          {
            echo "### production ops: $ACTION"
            echo '```'
            cat ops.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
