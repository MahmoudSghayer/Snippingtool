<!doctype html><html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"articleDetailsFallback": {"title": "FUTTIES in Football Ultimate Team™ - EA SPORTS", "summary": "Celebrate an unforgettable season in Football Ultimate Team™.", "slug": "fc-26-futties", "publishingDate": "2026-07-24T18:00:00.000+01:00", "type": "News Article", "body": "\n![EA SPORTS FC 26 Football Ultimate Team FUTTIES title displayed on an orange and black gradient background with abstract graphics.](https://drop-assets.ea.com/images/1Bm9o4uJ6eL7Huj30r8TsO/6a24193ac1b30d1d04a840228fa3bf04/fc26-futties-feat-img.jpg?im=AspectCrop=%2816,9%29,xPosition=0.5,yPosition=0.5)\n## **FAN-FAVOURITES RETURN**\n\nCelebrate an unforgettable season with FUTTIES Player Items and the return of fan-favourites from across the Football Ultimate Team™ season.\n\nPlay Football Ultimate Team™ now to earn themed rewards through new Live Events, Squad Building Challenges, Objectives, Evolutions, and more.\n## **PERSONALISE IN PLAYSTYLE LAB**\n\nJust like FUT Birthday and Festival of Football: Glory Hunters, every regular FUTTIES Player Item launches with zero PlayStyles and zero PlayStyle+, giving you freedom to customise your squad through PlayStyle Lab Evolutions.\n\nFUTTIES also raises the Evolution cap to four PlayStyle+, maximising your potential to build your most personalised XIs yet. Also, keep an eye out for a fifth PlayStyle+ Evolution Consumable towards the end of the campaign.\n\nAcross four weeks, FUTTIES delivers new themed Player Items celebrating the biggest fan-favourites of the EA SPORTS FC™ 26 season, alongside nostalgic re-releases from previous campaigns and years gone-by.\n\nEvery FUTTIES Player Item features at least one 5-Star Skill Moves or 5-Star Weak Foot and four alternate Positions, making them some of the most versatile players yet.\n## **SQUAD BUILDI"}}}}</script></body></html>
