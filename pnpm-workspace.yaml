packages:
  - 'apps/*'
  - 'packages/*'

# Both are transitive build-time deps (esbuild via vitest, unrs-resolver via
# eslint-import-resolver-typescript); their install scripts only fetch/build
# their own native binaries, nothing repo-specific.
allowBuilds:
  argon2: true
  esbuild: true
  unrs-resolver: true
