# Redis 7 config for The Sniper's Ledger — sessions, rate-limit counters,
# BullMQ queues, WS pub/sub fan-out and presence (see docs/01-architecture.md
# §1). Used by every compose file (dev/staging/prod); staging/prod override
# `maxmemory`/`requirepass` via env substitution in their compose file.

# --- Networking --------------------------------------------------------
# Bound to all interfaces inside the container network; access control is
# the Docker network boundary + `requirepass` below, not `bind`.
protected-mode yes

# --- Persistence ---------------------------------------------------------
# RDB snapshots: good enough for this workload (sessions/rate-limit state is
# fine to lose a few minutes of; BullMQ jobs that matter are idempotent or
# re-enqueued by their own retry logic) and what infra/backups/redis-backup.sh
# copies out. AOF is left off to keep the container light; if job durability
# ever becomes a hard requirement, switch appendonly to yes and add AOF to
# the backup script.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly no

# --- Memory ----------------------------------------------------------------
# allkeys-lru: everything Redis holds here (sessions, rate-limit windows,
# WS presence, BullMQ job data) is either reconstructable or has its own
# TTL/retry semantics, so evicting the least-recently-used key under memory
# pressure is safe — better than OOM-killing the process. Override
# maxmemory per environment (dev is generous; prod is sized to the VM).
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Misc --------------------------------------------------------------
# `requirepass` is set via `--requirepass "$REDIS_PASSWORD"` on the redis
# command line in staging/prod compose (config-file values can't reference
# env vars; command-line args override this file) rather than here — dev
# has no password, matching REDIS_URL=redis://redis:6379 with no credentials
# in infra/env/.env.development.example.
timeout 0
tcp-keepalive 300
