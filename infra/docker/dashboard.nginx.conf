# nginx config for the self-hosted dashboard image (infra/docker/dashboard.Dockerfile).
# Runs entirely as the non-root `sl` user on port 8080 — every path below
# that nginx writes to (pid, temp dirs) lives under /tmp or /var/cache/nginx,
# both chowned to `sl` in the Dockerfile.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  # --- compression ---------------------------------------------------------
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/wasm image/svg+xml font/ttf font/otf;

  # Compiled into the fholzer/nginx-brotli image (not stock nginx:alpine).
  brotli on;
  brotli_comp_level 5;
  brotli_min_length 256;
  brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/wasm image/svg+xml font/ttf font/otf;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "0" always;
    # Vite's build injects hashed asset URLs and no inline event handlers;
    # 'unsafe-inline' on style-src covers Tailwind's injected <style> tag and
    # React's a11y-focus outline styles. connect-src is intentionally left to
    # '*' at the CSP layer (the dashboard's own JS decides its API origin
    # from VITE_API_ORIGIN at build time) since this static server has no way
    # to know the deployment's API origin at request time; tighten this
    # per-deployment by templating the value in if needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Hashed build assets (Vite outputs content-hashed filenames under
    # /assets/) are immutable — cache aggressively.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Static pages + SPA fallback. index.html is the static landing page;
    # /terms and /refund-policy are directories holding their own
    # index.html; any other path that isn't a real file serves app.html (the
    # React SPA) so the client-side router (TanStack Router) handles deep
    # links like /login or /dashboard. `$uri/index.html` (not `$uri/`) avoids
    # nginx's 301 to a trailing-slash URL for /terms. HTML must never be
    # cached so a new deploy is picked up immediately.
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri $uri/index.html /app.html;
    }
  }
}
