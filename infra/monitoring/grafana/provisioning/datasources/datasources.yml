apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # Business KPIs dashboard reads analytics_daily (and the MRR/ARR/churn/
  # retention views, docs/02-database.md §7) directly via SQL — the
  # materialised rollup a nightly job writes, not a live OLTP query.
  #
  # Uses Grafana's $__env{} provisioning-time env expansion (Grafana >= 8.5)
  # so the same file works unchanged across dev/staging/prod: dev's compose
  # sets these to sl/sl; staging/prod set them from their env file's real,
  # read-only reporting credentials (grant SELECT on analytics_daily/views
  # only — see docs/11-devops.md's secrets section).
  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: $__env{GRAFANA_PG_HOST}:$__env{GRAFANA_PG_PORT}
    database: $__env{GRAFANA_PG_DATABASE}
    user: $__env{GRAFANA_PG_USER}
    secureJsonData:
      password: $__env{GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: $__env{GRAFANA_PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    editable: false
