# Promtail — tails every container's stdout (Docker's json-file log driver,
# the compose default) and ships it to Loki. apps/api logs structured pino
# JSON to stdout (see docs/03-api.md §1 "Logging"); the pipeline below
# parses that JSON and promotes level/module/requestId to labels so Grafana
# (Loki datasource, "DB / Redis" and "API Overview" dashboards' log panels)
# can filter by them without a full-text scan.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Docker Compose sets com.docker.compose.service on every container —
      # use it as the `service` label (server/worker/postgres/redis/...).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            reqId: reqId
            module: name
      - labels:
          level:
          module:
      - timestamp:
          source: time
          format: UnixMs
          fallback_formats:
            - RFC3339
      - output:
          source: msg
