# Prometheus scrape config — shared by dev (monitoring profile),
# docker-compose.staging.yml and docker-compose.prod.yml. Service names below
# are the compose service names, resolved via the compose network's DNS.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: sniper-ledger

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # No Alertmanager container is shipped for the MVP (single-VM
          # scale doesn't justify it yet — see docs/11-devops.md's scaling
          # notes); rules still evaluate and are visible/queryable in
          # Prometheus + Grafana. Point this at an Alertmanager instance
          # (or a hosted one) when paging integrations are wired up.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # apps/api exposes prom-client metrics at GET /metrics (see
  # docs/03-api.md §3 `health / metrics`). One target per role; both are the
  # same image, different compose services/containers.
  # NOTE: if the api service is scaled to N replicas (`docker compose up
  # --scale api=3`), Docker's embedded DNS round-robins `api` across them, so
  # a static target here samples one replica at random per scrape rather
  # than all of them — fine for the MVP's alerting (aggregate rate()/
  # histogram_quantile() queries still work; a single replica being down
  # shows as gaps/lower throughput, still caught by `APIDown`/error-rate
  # rules below). Move to `dns_sd_configs` (or a registrator/consul side-car)
  # if true per-replica dashboards become necessary — see docs/11-devops.md
  # "scaling notes".
  - job_name: sniper-ledger-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels: { role: 'server' }

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
