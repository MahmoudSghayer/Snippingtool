# gitleaks configuration for CI's `security-scan` job
# (.github/workflows/ci.yml) — the stock ruleset plus one allowlist entry.
#
# infra/env/.env.development.example carries the *documented dev-only*
# JWT_PRIVATE_KEY / ENTITLEMENT_SIGNING_KEY defaults that every local and CI
# run copies into apps/api/.env. They are not secrets: apps/api/src/config/env.ts
# refuses to boot in production unless real keys are supplied, and the same
# guard is what the docs/09-security.md key-rotation section points at. Any
# other committed PEM block is still a finding.
title = "sniper-ledger"

[extend]
useDefault = true

#
# The three extension unit-test files below hold test fixtures only: the
# Ed25519 keypair the test build verifies entitlements with (its public half
# is set in apps/extension/vitest.config.ts; release builds take
# ENTITLEMENT_PUBLIC_KEY from the repository variables instead and refuse to
# build without one), JWS blobs signed with that test key, and made-up
# passwords for mocked register/login calls.
[allowlist]
description = "dev-only example keys the API refuses to run with in production, and extension test fixtures"
paths = [
  '''^infra/env/\.env\.development\.example$''',
  '''^apps/extension/test/unit/license-test-keys\.ts$''',
  '''^apps/extension/test/unit/adapter-shapes\.test\.ts$''',
  '''^apps/extension/test/unit/register-verify-email\.test\.ts$''',
]
